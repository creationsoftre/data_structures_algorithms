<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>retro-win98-desktop</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/codeViewer.css">
    <link rel="stylesheet" href="css/quiz.css">
    <link rel="stylesheet" href="css/achievements.css">
  </head>
  <body>
    <main id="desktop" class="desktop" aria-label="Windows 98 inspired desktop">
      <section id="desktop-icons" class="desktop-icons" aria-label="Desktop icons"></section>
      <section id="windows" class="windows-layer" aria-label="Open windows"></section>
    </main>

    <footer class="taskbar" aria-label="Taskbar">
      <button id="start-button" class="start-button" type="button" aria-label="Start">
        <span class="start-logo" aria-hidden="true"></span>
        Start
      </button>
      <div id="taskbar-items" class="taskbar-items" aria-label="Open applications"></div>
      <time id="clock" class="clock" aria-label="Current time"></time>
    </footer>

    <script src="js/filesystem.js"></script>
    <script src="js/progressTracker.js"></script>
    <script src="js/achievements.js"></script>
    <script src="js/quizSystem.js"></script>
    <script src="js/demoRunner.js"></script>
    <script src="js/codeViewer.js"></script>
    <script src="js/terminal.js"></script>
    <script src="js/windows.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
